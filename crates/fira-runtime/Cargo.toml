[package]
name = "fira-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FIRA Guardian RUNTIME — capability enforcement {READ, EXECUTE_EXISTING}, VerificationMechanism registry (EXEC-1), ExecutionResult production, external-workspace persistence (WS-1). No project-tree writes."

[dependencies]
fira-core = { path = "../fira-core" }
fira-policy = { path = "../fira-policy" }
# Discovery parses project-declared manifests only (structural). serde/serde_json/
# toml are pure data libraries; process execution uses std::process::Command with
# explicit arg vectors (no shell crate), and no network/TLS crate is present.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
# Temp project trees + symlink/output-path containment tests (test-only).
tempfile = "3"
