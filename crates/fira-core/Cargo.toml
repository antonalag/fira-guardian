[package]
name = "fira-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FIRA Guardian CORE — platform-independent audit domain. No sibling-crate, host, or OS dependencies."

# CORE is platform-independent (Frozen MVP Contract, Layer ownership).
# It must NOT depend on fira-policy, fira-runtime, fira-adapters,
# fira-presentation, or fira-cli. This is enforced by manifest_test (AC-5).
#
# serde and serde_json are pure, host-capability-free data libraries. They grant
# no filesystem, process, or network capability, so they do not weaken CORE's
# platform independence (the no-fs/no-proc tripwire still applies to our source).
# serde (derive) backs the Task 4 CORE domain model (de)serialization.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
toml = "0.8"
# jsonschema is used only by the test targets to validate the bundled S1-S12
# JSON Schemas and the example corpus (Draft 2020-12), offline. It is a
# dev-dependency so it never enters CORE's runtime dependency set (AC-11).
jsonschema = "0.17"
# url is used by the test-only BundledResolver (SchemaResolver::resolve receives a
# parsed Url). Dev-dependency only; not part of CORE's runtime deps.
url = "2"
